# Gumdrop, ninekit's sample concept: a scoreboard set in the layer language (no blocks), at three scales.
#   ninekit build examples/gumdrop/scoreboard.yaml     -> out/scoreboard/ (git-ignored)
#   ninekit verify examples/gumdrop/scoreboard.yaml && ninekit preview examples/gumdrop/scoreboard.yaml
#   card / card_me       a row card: white-lilac face, a lavender lip, a soft shadow; the local player's row in mint
#   panel                the deep violet panel the rows and tabs sit on
#   pill_sel / pill_idle the selected and idle pill of a segmented control
#   tab_strip            the recessed track the pills sit in
#   metric               a small inset box for a row's number (on a card)
#   medal_1 / _2 / _3    rank coins with an embossed star, drawn whole
ninekit: 1
name: gumdrop_scoreboard
scales: [1, 2, 3]
out: out/scoreboard/

vars:
  CR: 16               # card corner radius
  CLIP: 5              # the card's lip (its thickness)
  CSH: 3               # room for the card's shadow below it
  PR: 18               # panel corner radius
  PE: 1.2              # panel outline
  PLIP: 5              # panel lip
  TR: 13               # tab strip corner radius
  MR: 8                # metric box corner radius

colors:
  shade: "#1c1537"                     # every soft shadow
  card_face: [[0, "#FFFFFF"], [0.12, "#F9F6FF"], [0.6, "#EFEAFC"], [1, "#E5DDF7"]]
  card_lip: [[0, "#BDABEA"], [1, "#9C88D2"]]
  card_edge: "#8B76C8"
  card_light: [[0, "#FFFFFFF0"], [1, "#FFFFFF00"]]
  panel_edge: "#1E1246"
  panel_face: [[0, "#5B3DA6"], [0.08, "#4E3296"], [0.6, "#45298A"], [1, "#3D237D"]]
  panel_lip: [[0, "#2C1A62"], [1, "#22144E"]]
  panel_light: "#9C82EA"
  pill_edge: "#5E0D36"
  pill_lip: [[0, "#B4246A"], [1, "#8C1752"]]
  pill_face: [[0, "#FF9CC9"], [0.2, "#FA6FAA"], [0.65, "#EB4D93"], [1, "#D93D86"]]
  pill_gloss: [[0, "#FFFFFFC0"], [1, "#FFFFFF1A"]]
  track_floor: [[0, "#0D0721"], [4.5, "#33236F"]]
  track_light: "#8E71E2"
  metric_face: [[0, "#CBBDF0"], [1, "#DED4F8"]]
  coin_thick: "#A2670E"
  coin_rim: [[0, "#FFE58A"], [0.45, "#F7C23A"], [1, "#CF8A16"]]
  coin_edge: "#8E5509"
  coin_disc: [[0, "#BF7C0B"], [1, "#F3C950"]]
  coin_star: [[0, "#FFF5C2"], [1, "#FFD75C"]]
  coin_star_shade: "#9A5E08"

pieces:
  # --- the row card: a white-lilac face, a lavender lip showing its thickness, a soft shadow, a light top rim
  card:
    size: [72, 60]
    content: [14, 10, 14, 16]          # where the row's name, metric and medal go
    overhang: [0, 0, 0, 3]             # the shadow below the card is outside its logical box
    vars:
      B: h - CSH                       # the card's bottom
    layers:
      - name: shadow
        shape: {rect: [1, 2, "w - 1", "B + 2"], r: CR}
        fill: shade
        soft: 2.5
        falloff: smooth
        opacity: 0.28
      - name: lip
        shape: {rect: [0, 0, w, B], r: CR}
        fill: {vgrad: card_lip, from: "B - CLIP - 6", to: B}
      - name: face
        shape: {rect: [0, 0, w, "B - CLIP"], r: CR}
        fill: {vgrad: card_face, to: "B - CLIP"}
      - name: top rim light
        shape: {rect: [0, 0, w, "B - CLIP"], r: CR}
        ring: 1.5
        fill: {vgrad: card_light, from: 0, to: 12}
      - name: edge
        shape: {rect: [0, 0, w, B], r: CR}
        ring: 1
        fill: card_edge
        opacity: 0.55
    variants:
      card_me:                         # the local player's row: the same card in mint
        colors:
          card_face: [[0, "#F7FFFB"], [0.12, "#EBFCF3"], [0.6, "#DAF6E8"], [1, "#C9EEDB"]]
          card_lip: [[0, "#83D3AE"], [1, "#5DB28B"]]
          card_edge: "#3E9B73"

  # --- the deep violet panel: a dark outline, a light top line, a darker lip, a faint inner glow
  panel:
    size: [80, 72]
    content: [14, 12, 14, 18]
    overhang: [0, 0, 0, 2]
    vars:
      B: h - 2                         # the panel's bottom (a short shadow below it)
      FB: B - PE - PLIP                # the face's bottom
    layers:
      - name: shadow
        shape: {rect: [1, 1.5, "w - 1", "B + 2"], r: PR}
        fill: shade
        soft: 2
        falloff: smooth
        opacity: 0.4
      - name: outline
        shape: {rect: [0, 0, w, B], r: PR}
        fill: panel_edge
      - name: lip
        shape: {rect: [PE, PE, "w - PE", "B - PE"], r: "PR - PE"}
        fill: {vgrad: panel_lip, from: "FB - 4", to: "B - PE"}
      - name: face
        shape: &panel_face {rect: [PE, PE, "w - PE", FB], r: "PR - PE"}
        fill: {vgrad: panel_face, from: PE, to: FB}
      - name: inner glow
        shape: *panel_face
        fill: {depth: [[0, "#FFFFFF24"], [3, "#FFFFFF00"]]}
      - name: top line
        shape: *panel_face
        ring: 1
        clip: {rect: [0, 0, w, 12]}
        fill: panel_light
        opacity: 0.85

  # --- the pills of a segmented control: a capsule with a lip and a glossy face; the gloss spans the width and
  # ends inside the caps (nothing in the stretched middle). Rounded over their whole height: y is `fixed`.
  pill_sel:
    size: [64, 32]
    content: [14, 5, 14, 8]
    layers:
      - name: edge
        shape: {rect: [0, 0, w, h], r: "h / 2"}
        fill: pill_edge
      - name: lip
        shape: {rect: [1.2, 1.2, "w - 1.2", "h - 1.2"], r: "h / 2 - 1.2"}
        fill: {vgrad: pill_lip, from: "h - 9", to: "h - 1.2"}
      - name: face
        shape: {rect: [1.2, 1.2, "w - 1.2", "h - 4.5"], r: "(h - 5.7) / 2"}
        fill: {vgrad: pill_face, from: 1.2, to: "h - 4.5"}
      - name: gloss
        shape: {rect: [8, 3, "w - 8", "h / 2 - 1"], r: 5}
        fill: {vgrad: pill_gloss, from: 3, to: "h / 2 - 1"}
    variants:
      pill_idle:                       # unselected: a quiet lilac
        colors:
          pill_edge: "#2A1A5C"
          pill_lip: [[0, "#7C66C2"], [1, "#5E499F"]]
          pill_face: [[0, "#E4DAFB"], [0.2, "#D3C5F4"], [0.65, "#BBA8EA"], [1, "#AA95E0"]]
          pill_gloss: [[0, "#FFFFFF8C"], [1, "#FFFFFF0D"]]

  # --- the recessed track the pills sit in: a dark rim, a floor shaded by depth, a light line under it
  tab_strip:
    size: [80, 40]
    content: [4, 4, 4, 5]
    layers:
      - name: light under
        shape: {rect: [0, 1.2, w, h], r: TR}
        fill: track_light
        opacity: 0.7
      - name: rim
        shape: {rect: [0, 0, w, "h - 1.2"], r: TR}
        fill: "#150B36"
      - name: floor
        shape: {rect: [1, 1, "w - 1", "h - 2.2"], r: "TR - 1"}
        fill: {depth: track_floor}

  # --- a small inset box for a row's number, sunk into the card
  metric:
    size: [48, 26]
    content: [8, 3, 8, 4]
    layers:
      - name: light under
        shape: {rect: [0, 1, w, h], r: MR}
        fill: "#FFFFFF"
        opacity: 0.85
      - name: floor
        shape: {rect: [0, 0, w, "h - 1"], r: MR}
        fill: {vgrad: metric_face, from: 0, to: "h - 1"}
      - name: inner shadow
        shape: {rect: [0, 0, w, "h - 1"], r: MR}
        fill: {depth: [[0, "#5A44A6B0"], [1.2, "#5A44A630"], [3, "#5A44A600"]]}

  # --- rank coins, drawn whole: a soft shadow, the coin's thickness, a bevelled rim, a recessed disc and an
  # embossed five-pointed star (points at radius S, inner corners at S * 0.45), a gloss on the rim
  medal_1:
    size: [34, 36]
    slice: none
    vars:
      CX: w / 2
      CY: 15.5
      R: 15
      S: 7.8
      SI: S * 0.45
    layers:
      - name: shadow
        shape: {circle: [CX, "CY + 3", "R - 0.5"]}
        fill: shade
        soft: 2
        falloff: smooth
        opacity: 0.35
      - name: thickness
        shape: {circle: [CX, "CY + 1.6", R]}
        fill: coin_thick
      - name: edge
        shape: {circle: [CX, CY, R]}
        fill: coin_edge
      - name: rim
        shape: {circle: [CX, CY, "R - 0.8"]}
        fill: {vgrad: coin_rim, from: "CY - R", to: "CY + R"}
      - name: disc
        shape: {circle: [CX, CY, "R * 0.72"]}
        fill: {vgrad: coin_disc, from: "CY - R * 0.72", to: "CY + R * 0.72"}
      - name: star shade
        offset: [0, 0.7]
        shape: &star
          polygon:
            - [CX, "CY - S"]
            - ["CX + SI * sin(pi / 5)", "CY - SI * cos(pi / 5)"]
            - ["CX + S * sin(2 * pi / 5)", "CY - S * cos(2 * pi / 5)"]
            - ["CX + SI * sin(3 * pi / 5)", "CY - SI * cos(3 * pi / 5)"]
            - ["CX + S * sin(4 * pi / 5)", "CY - S * cos(4 * pi / 5)"]
            - [CX, "CY + SI"]
            - ["CX - S * sin(4 * pi / 5)", "CY - S * cos(4 * pi / 5)"]
            - ["CX - SI * sin(3 * pi / 5)", "CY - SI * cos(3 * pi / 5)"]
            - ["CX - S * sin(2 * pi / 5)", "CY - S * cos(2 * pi / 5)"]
            - ["CX - SI * sin(pi / 5)", "CY - SI * cos(pi / 5)"]
        fill: coin_star_shade
        opacity: 0.8
      - name: star
        shape: *star
        fill: {vgrad: coin_star, from: "CY - S", to: "CY + S * 0.8"}
      - name: gloss
        shape: {ellipse: ["CX - R * 0.32", "CY - R * 0.62", "R * 0.34", "R * 0.16"], angle: -28}
        fill: "#FFFFFF"
        soft: 1
        opacity: 0.6
    variants:
      medal_2:
        colors:
          coin_thick: "#6B7789"
          coin_rim: [[0, "#F7F9FC"], [0.45, "#CBD3DE"], [1, "#8D99AA"]]
          coin_edge: "#5A6577"
          coin_disc: [[0, "#8592A5"], [1, "#CBD3DF"]]
          coin_star: [[0, "#FFFFFF"], [1, "#E3E9F1"]]
          coin_star_shade: "#4E596B"
      medal_3:
        colors:
          coin_thick: "#86431D"
          coin_rim: [[0, "#F8C29A"], [0.45, "#DE8E55"], [1, "#A95A2C"]]
          coin_edge: "#733816"
          coin_disc: [[0, "#B4643A"], [1, "#E6A374"]]
          coin_star: [[0, "#FFE3CC"], [1, "#F3B07F"]]
          coin_star_shade: "#7E3F19"
