# A 12 x 12 dp test sprite for demos/flutter/test: red 4 dp corners (each with a white 1 dp dot), green edges, a
# blue middle; explicit slices, so nothing is compacted and the 3x file is exactly 3x the 1x file. Flutter picks
# 1.0x or 3.0x by device pixel ratio; the tests count texels to settle which units `centerSlice` is in.
ninekit: 1
name: probe
scales: [1, 3]
pieces:
  probe:
    size: [12, 12]
    slice: [4, 4, 4, 4]
    layers:
      - shape: {all: true}
        fill: "#2040FF"
      - shape: {union: [{rect: [0, 0, w, 4]}, {rect: [0, "h - 4", w, h]}, {rect: [0, 0, 4, h]}, {rect: ["w - 4", 0, w, h]}]}
        fill: "#20C040"
      - shape: {union: [{rect: [0, 0, 4, 4]}, {rect: ["w - 4", 0, w, 4]}, {rect: [0, "h - 4", 4, h]}, {rect: ["w - 4", "h - 4", w, h]}]}
        fill: "#FF2020"
      - shape: {union: [{rect: [1, 1, 2, 2]}, {rect: ["w - 2", 1, "w - 1", 2]}, {rect: [1, "h - 2", 2, "h - 1"]}, {rect: ["w - 2", "h - 2", "w - 1", "h - 1"]}]}
        fill: "#FFFFFF"
